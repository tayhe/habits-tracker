services:
  habits-tracker:
    build:
      context: .
      args:
        UID: 1002
        GID: 1002

    ports:
      - "15000:15000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:15000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

