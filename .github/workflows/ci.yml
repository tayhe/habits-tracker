name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Test (pytest)
        run: .venv/bin/pytest -q

      - name: "Guard - no raw clock reads outside clock.py"
        run: ./scripts/check_bare_dates.sh

      - name: Frontend checks (syntax + unit)
        run: ./scripts/check_frontend.sh

      - name: Frontend/backend parity (ISO week + emoji)
        run: ./scripts/parity_check.sh

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Install headless Chromium (Playwright)
        run: .venv/bin/playwright install --with-deps chromium

      - name: Headless UI smoke
        run: ./scripts/ui_smoke.sh

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-shots
          path: /tmp/opencode/ui-smoke-shots
          if-no-files-found: ignore
          retention-days: 7
