name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: "Guard - no raw clock reads outside clock.py"
        run: ./scripts/check_bare_dates.sh

      - name: Frontend checks (syntax + unit)
        run: ./scripts/check_frontend.sh

      - name: Frontend/backend parity (ISO week + emoji)
        run: ./scripts/parity_check.sh
